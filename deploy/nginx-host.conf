# Bloque a agregar DENTRO del server { } de bombardeen-palencia.xyz en el host
# (archivo /etc/nginx/sites-available/csgo-api). NO es un server block propio:
# agregar un segundo server con el mismo server_name causaria conflicto en nginx.

location /franc/calculadora/ {
    proxy_pass http://localhost:24750/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
